name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: pnpm bereitstellen
        run: corepack enable && corepack prepare pnpm@9 --activate

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Pakete bauen
        run: pnpm -r build

      - name: Prüfen
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      - name: Bündeln
        run: pnpm bundle

      - name: Startdatei benennen
        run: mv build/web.js build/app.js

      - name: Migrationen mitliefern
        run: cp -r packages/api/src/db/migrations build/migrations || true

      - name: SSH vorbereiten
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.NETCUP_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.NETCUP_HOST }}" >> ~/.ssh/known_hosts

      - name: Hochladen
        run: |
          tar -czf - -C build --exclude './tmp' . \
            | ssh -i ~/.ssh/id_ed25519 \
                "${{ secrets.NETCUP_USER }}@${{ secrets.NETCUP_HOST }}" \
                "mkdir -p '${{ secrets.NETCUP_APP_ROOT }}' \
                 && tar -xzf - -C '${{ secrets.NETCUP_APP_ROOT }}'"
          # Kein rsync: netcups Chroot-Umgebung stellt es nicht bereit, und rsync
          # braucht das Programm auf beiden Seiten. tar ist dort vorhanden.
          # tmp/: von Passenger verwaltet (u.a. restart.txt fuer den Neustart-Trigger).
          #       `pnpm bundle` legt ein leeres build/tmp an, deshalb der Ausschluss --
          #       ohne ihn ueberschriebe das Deployment Passengers Arbeitsverzeichnis.
          # data/: enthaelt korrektur.db (SQLite, WAL-/SHM-Dateien inklusive) ausserhalb
          #        von httpdocs, siehe Design-Spec §13. tar legt nur an und ueberschreibt,
          #        loescht also nichts -- die Datenbank ueberlebt jedes Deployment.
          #        Im Gegenzug bleiben entfallene Dateien auf dem Server liegen.

      - name: Anwendung neu starten
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.NETCUP_USER }}@${{ secrets.NETCUP_HOST }}" \
            "mkdir -p '${{ secrets.NETCUP_APP_ROOT }}/tmp' && touch '${{ secrets.NETCUP_APP_ROOT }}/tmp/restart.txt'"
